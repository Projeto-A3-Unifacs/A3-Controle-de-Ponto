name: Release Semântico

on:
  push:
    branches:
      - main

jobs:
  semantic_release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessário para criar tag, commit e release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # precisa de histórico completo para ler os commits

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Gera versão semântica + tag + changelog com base em conventional commits
      - name: Gerar versão semântica e changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-prefix: 'v'
          output-file: 'CHANGELOG.md'   # mantém/atualiza arquivo CHANGELOG.md
          skip-commit: 'false'          # faz commit do changelog + bump de versão
          skip-tag: 'false'             # cria a tag automaticamente

      # Se não houver commits que alterem versão, o job pode ser "skipped"
      - name: Log quando nenhum release é gerado
        if: steps.changelog.outputs.skipped == 'true'
        run: echo "Nenhuma versão gerada (commits não relevantes para versionamento semântico)."

      # A partir daqui, só roda se NÃO tiver sido pulado
      - name: Configurar Java (JDK 21)
        if: steps.changelog.outputs.skipped != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache do Maven
        if: steps.changelog.outputs.skipped != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR com Maven
        if: steps.changelog.outputs.skipped != 'true'
        working-directory: ./Controle-Ponto
        run: mvn -B clean package

      - name: Criar GitHub Release com JAR
        if: steps.changelog.outputs.skipped != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Release ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          files: |
            Controle-Ponto/target/Controle-Ponto-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
