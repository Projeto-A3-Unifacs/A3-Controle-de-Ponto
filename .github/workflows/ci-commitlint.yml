name: CI e Commitlint

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # -----------------------------
  # JOB 1: Commitlint
  # -----------------------------
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do commitlint
        run: |
          npm install @commitlint/cli @commitlint/config-conventional

      - name: Rodar commitlint
        run: |
          npx commitlint --from=HEAD~1 --to=HEAD
        env:
          HUSKY: 0

  # -----------------------------
  # JOB 2: CI (Build + Testes Maven)
  # -----------------------------
  ci:
    runs-on: ubuntu-latest
    needs: commitlint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache do Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Rodar testes Maven
        working-directory: ./Controle-Ponto
        run: mvn -B test
