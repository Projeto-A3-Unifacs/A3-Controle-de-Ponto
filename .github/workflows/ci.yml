name: CI

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev ]

jobs:
  # --- Se usar Maven (Java), mantenha este job e apague o de Node ---
  build-maven:
    if: ${{ true() }} # troque para "true" quando decidir o stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build & Test (Maven)
        run: mvn -B -ntp -q verify
