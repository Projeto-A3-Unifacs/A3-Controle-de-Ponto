name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Build & Test (Maven)
        run: |
          if [ -f "pom.xml" ]; then mvn -B -DskipTests=false clean verify; \
          elif [ -f "Controle-Ponto/pom.xml" ]; then cd Controle-Ponto && mvn -B -DskipTests=false clean verify; \
          else echo "Nenhum pom.xml encontrado"; exit 1; fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            **/target/site/jacoco
