name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find build file (pom.xml or build.gradle)
        id: find
        run: |
          set -e
          MAVEN_FILE=$(git ls-files | grep -E '/?pom\.xml$' | head -n1 || true)
          GRADLE_FILE=$(git ls-files | grep -E '/?build\.gradle(\.kts)?$' | head -n1 || true)

          echo "MAVEN_FILE=$MAVEN_FILE"
          echo "GRADLE_FILE=$GRADLE_FILE"

          if [ -n "$MAVEN_FILE" ]; then
            DIR=$(dirname "$MAVEN_FILE")
            echo "tool=maven" >> $GITHUB_OUTPUT
            echo "workdir=$DIR" >> $GITHUB_OUTPUT
          elif [ -n "$GRADLE_FILE" ]; then
            DIR=$(dirname "$GRADLE_FILE")
            echo "tool=gradle" >> $GITHUB_OUTPUT
            echo "workdir=$DIR" >> $GITHUB_OUTPUT
          else
            echo "Nenhum pom.xml ou build.gradle(.kts) encontrado no repo."
            echo "Verifique se o projeto Java foi commitado e em qual pasta está."
            exit 1
          fi

      - name: Show working directory and tree
        run: |
          echo "Working dir: ${{ steps.find.outputs.workdir }}"
          ls -la "${{ steps.find.outputs.workdir }}"

      - name: Build & Test (Maven)
        if: steps.find.outputs.tool == 'maven'
        working-directory: ${{ steps.find.outputs.workdir }}
        run: mvn -B -DskipTests=false verify

      - name: Build & Test (Gradle)
        if: steps.find.outputs.tool == 'gradle'
        working-directory: ${{ steps.find.outputs.workdir }}
        run: |
          chmod +x ./gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew test build --stacktrace
          else
            # sem wrapper: usa gradle de sistema
            gradle test build --stacktrace
          fi
