name: Release (dev test)
on:
  push:
    branches: [ dev ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: maven
          target-branch: dev
          path: Controle-Ponto
