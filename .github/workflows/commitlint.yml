name: Lint Commit Messages

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔹 Adicionando condição para ignorar merges automáticos
      - name: Commitlint
        if: "!contains(github.event.head_commit.message, 'Merge')"  # <-- ignora commits de merge
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
          commitDepth: 10
          failOnWarnings: false
