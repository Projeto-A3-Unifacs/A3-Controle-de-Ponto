name: Lint Commit Messages

on:
  pull_request:
    branches: [main, dev, test/merge-commitlint]  # ← inclua sua base de teste aqui
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
          commitDepth: 10        # PR de teste costuma ter poucos commits
          failOnWarnings: false
