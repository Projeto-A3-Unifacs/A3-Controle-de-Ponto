name: CI, Commitlint e Versionamento Semântico

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Etapa 1: CI - Build e Testes
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissões para manipulação de conteúdo (necessário para checkout)
      pull-requests: write  # Permissões para criar e modificar pull requests
      actions: write  # Permissões para ações do GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find build file (pom.xml ou build.gradle)
        id: find
        run: |
          set -e
          MAVEN_FILE=$(git ls-files | grep -E 'Controle-Ponto/pom\.xml$' | head -n1 || true)
          GRADLE_FILE=$(git ls-files | grep -E 'Controle-Ponto/build\.gradle(\\.kts)?$' | head -n1 || true)
          
          echo "MAVEN_FILE=$MAVEN_FILE"
          echo "GRADLE_FILE=$GRADLE_FILE"

          if [ -n "$MAVEN_FILE" ]; then
            DIR=$(dirname "$MAVEN_FILE")
            echo "tool=maven" >> $GITHUB_OUTPUT
            echo "workdir=$DIR" >> $GITHUB_OUTPUT
          elif [ -n "$GRADLE_FILE" ]; then
            DIR=$(dirname "$GRADLE_FILE")
            echo "tool=gradle" >> $GITHUB_OUTPUT
            echo "workdir=$DIR" >> $GITHUB_OUTPUT
          else
            echo "Nenhum arquivo Maven ou Gradle encontrado!"
            exit 1
          fi

      - name: Run Maven Build
        run: |
          cd Controle-Ponto  # Muda para o diretório onde o pom.xml está localizado
          mvn clean install  # Executa o Maven no diretório correto

  # Etapa 2: Commitlint - Validação de Mensagens de Commit
  commitlint:
    runs-on: ubuntu-latest
    needs: ci  # Esta etapa depende da conclusão da etapa de CI
    permissions:
      contents: read  # Apenas leitura do conteúdo para verificar commits
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Importante para verificar os commits completos
      
      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
          commitDepth: 10
          failOnWarnings: false

  # Etapa 3: CD - Geração de Versão Semântica
  cd:
    runs-on: ubuntu-latest
    needs: commitlint  # Esta etapa depende da validação do commit
    permissions:
      contents: write  # Permissões para manipulação de conteúdo e tags
      pull-requests: write  # Permissões para criar pull requests para versão
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release Please
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: simple
          bump-minor-pre-major: true
          changelog-types: >
            [{"type":"feat","section":"Features","hidden":false},
             {"type":"fix","section":"Bug Fixes","hidden":false},
             {"type":"perf","section":"Performance","hidden":false},
             {"type":"refactor","section":"Refactors","hidden":true},
             {"type":"docs","section":"Docs","hidden":true},
             {"type":"test","section":"Tests","hidden":true},
             {"type":"chore","section":"Chores","hidden":true}]
