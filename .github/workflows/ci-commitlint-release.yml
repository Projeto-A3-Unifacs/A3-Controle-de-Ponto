name: CI e Commitlint

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Etapa 1: Commitlint (validação das mensagens de commit)
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # precisa do histórico para o commitlint comparar commits
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Commitlint
        run: |
          npm install @commitlint/cli @commitlint/config-conventional

      - name: Rodar Commitlint
        run: |
          npx commitlint --from=HEAD~1 --to=HEAD
        env:
          HUSKY: 0

  # Etapa 2: CI - Build e Testes Maven
  ci:
    runs-on: ubuntu-latest
    needs: commitlint  # Só roda se o commitlint passar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache do Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Rodar testes Maven
        working-directory: ./Controle-Ponto
        run: mvn -B test
