name: CI/CD Workflow with Build, Tests, Commitlint, and Release Please

on:
  push:
    branches:
      - main  # Aciona o workflow quando há push na branch main
      - dev   # Aciona o workflow quando há push na branch dev

  pull_request:
    branches:
      - main  # Aciona o workflow quando há um PR para a branch main
      - dev   # Aciona o workflow quando há um PR para a branch dev

jobs:
  # Etapa de CI (Commitlint)
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Commitlint
        run: |
          npm install --save-dev @commitlint/config-conventional @commitlint/cli

      - name: Lint commits
        run: |
          npx commitlint --from=HEAD~1 --to=HEAD

  # Etapa de Build e Testes (CI)
  build_and_test:
    runs-on: ubuntu-latest
    needs: commitlint  # A etapa de build e testes precisa aguardar a etapa commitlint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Instalação das dependências (dependendo do seu projeto, pode ser npm, yarn, maven, gradle, etc)
      - name: Install dependencies
        run: |
          npm install  # Para projetos Node.js, ajuste para o seu ambiente (por exemplo, `yarn install` ou `mvn install`)

      # Etapa de build do projeto
      - name: Build project
        run: |
          npm run build  # Para projetos Node.js, ajuste para o seu ambiente (por exemplo, `mvn clean install`)

      # Etapa de testes
      - name: Run tests
        run: |
          npm test  # Para projetos Node.js, ajuste para o seu ambiente (por exemplo, `mvn test` ou `gradle test`)

  # Etapa de CD (Release Please)
  cd:
    runs-on: ubuntu-latest
    needs: build_and_test  # A etapa de CD precisa aguardar a etapa de build e testes
    permissions:
      contents: write  # Permissão para editar o repositório
      pull-requests: write  # Permissão para criar pull requests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple  # Tipo de release (simples)
          target-branch: main  # Branch alvo para o release
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Usando o PAT armazenado como secret
